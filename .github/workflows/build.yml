name: Build

on:
  push:
#    branches: [ master ]
  workflow_dispatch:
    inputs:
      config:
        description: 'Configuration (config.sh [parameters])'
        required: true
        default: '--disable WITH_SOFTCAM'
      use:
        description: 'Use flags'
        required: true
        default: 'USE_LIBCRYPTO=1 USE_SSL=1 USE_LIBCURL=1 USE_LIBUSB=1 USE_PCSC=1'

jobs:
  build:
    name: x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ausführungsrechte für Skripte wiederherstellen
      - name: Fix script permissions
        shell: bash
        run: |
          echo "Checking script permissions..."

          find . -type f -print0 | while IFS= read -r -d '' file; do
            if head -n 1 "$file" | grep -q '^#!'; then
              chmod +x "$file"
              echo "Executable: $file"
            fi
          done

          chmod +x ./config.sh
          chmod +x ./webif/pages_mkdep

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get -q update
          sudo apt-get install -y openssl libcurl4-openssl-dev libusb-1.0-0-dev libpcsclite-dev

      - name: Build libdvbcsa
        shell: bash
        run: |
          git clone https://github.com/oe-mirrors/libdvbcsa.git
          cd libdvbcsa

          ./bootstrap
          ./configure --disable-shared --enable-static --enable-avx2
          make -j"$(nproc)"
          sudo make install

          echo
          echo -e "\033[1mTest:\033[m"

          cd test
          ./benchbitslice
          ./benchbitsliceks
          ./benchdec
          ./benchenc
          ./benchks
          ./testbitslice
          ./testbsops
          ./testdec
          ./testenc

      - name: Configuration
        shell: bash
        env:
          CONFIG_INPUT: ${{ github.event.inputs.config }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ./config.sh $CONFIG_INPUT
          else
            ./config.sh --enable MODULE_STREAMRELAY --disable WITH_SOFTCAM
          fi

      - name: Build
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          USE_FLAGS: ${{ github.event.inputs.use }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            make $USE_FLAGS
          else
            make USE_LIBCURL=1 USE_LIBUSB=1 EXTRA_CFLAGS="-DOPENSSL_API_COMPAT=0x10101000L -DWITH_SENDCMD"
          fi

      - name: Test
        shell: bash
        run: |
          echo
          echo -e "\033[1mNCam library dependencies:\033[m"

          readelf -d Distribution/ncam*debug | grep NEEDED | awk '{print $3" "$4" "$5}'

          echo
          echo -e "\033[1mNCam binary configuration and version:\033[m"

          Distribution/ncam*debug -V
